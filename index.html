<!DOCTYPE html>
<!-- index.html — the ONLY page of Code Lab.
     It's mostly empty: JavaScript fills the <main> box with the right screen
     (player picker, home, or a lesson). -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- This line makes the site fit phone screens properly. -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Code Lab</title>
  <!-- A retro pixel font, used only for the logo and big titles. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="topbar"></header>
  <main id="app"><p class="loading">Loading…</p></main>
  <!-- Little pop-up messages ("+10 XP!") appear in here. -->
  <div id="toasts" aria-live="polite"></div>

  <!-- Our code. The order matters: app.js goes first because it creates
       the shared CodeLab object that every other file adds to. -->
  <script src="js/app.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/sql-runner.js"></script>
  <script src="js/checker.js"></script>
  <script src="js/copy-for-claude.js"></script>
  <script src="js/home.js"></script>
  <script src="js/exercises.js"></script>
  <script src="js/lesson.js"></script>
  <script src="lessons/catalog.js"></script>
  <script>CodeLab.start();</script>
</body>
</html>
